name: iOS-ipa-build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-ios:
    name: 🎉 iOS Release Build
    runs-on: macos-14

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧷 Pin Mapbox Flutter version
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("pubspec.yaml")
          text = p.read_text()

          # Pin Mapbox Flutter to avoid resolving newer versions that require incompatible MapboxMaps pods.
          text = text.replace("mapbox_maps_flutter: ^2.23.1", "mapbox_maps_flutter: 2.23.1")
          text = text.replace("mapbox_maps_flutter: ^2.24.2", "mapbox_maps_flutter: 2.23.1")
          text = text.replace("mapbox_maps_flutter: 2.24.2", "mapbox_maps_flutter: 2.23.1")

          p.write_text(text)
          PY

          echo "✅ mapbox_maps_flutter pinned:"
          grep "mapbox_maps_flutter:" pubspec.yaml

      - name: 🛠️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🍎 Patch Podfile iOS 14.0 for Mapbox
        run: |
          set -e

          if [ ! -f ios/Podfile ]; then
            flutter create --platforms=ios .
          fi

          # Use CocoaPods CDN source.
          ruby <<'RUBY'
          path = 'ios/Podfile'
          podfile = File.read(path)

          # Remove older/duplicate source lines.
          podfile = podfile.lines.reject do |line|
            stripped = line.strip
            stripped == "source 'https://github.com/mapbox/mapbox-pod-specs.git'" ||
              stripped == "source 'https://github.com/CocoaPods/Specs.git'" ||
              stripped == "source 'https://cdn.cocoapods.org/'"
          end.join

          File.write(path, "source 'https://cdn.cocoapods.org/'\n" + podfile)
          RUBY

          # Ensure deployment target is iOS 14.0+
          if grep -q "^platform :ios" ios/Podfile; then
            sed -i '' "s/^platform :ios.*/platform :ios, '14.0'/" ios/Podfile
          else
            sed -i '' "1s/^/platform :ios, '14.0'\n/" ios/Podfile
          fi

          # Clean and replace post_install hook with unified settings.
          ruby <<'RUBY'
          path = 'ios/Podfile'
          podfile = File.read(path)

          def remove_post_install_blocks(text)
            result = +""
            i = 0

            while i < text.length
              start_idx = text.index(/^\s*post_install\s+do\s+\|installer\|/, i)

              if start_idx.nil?
                result << text[i..]
                break
              end

              result << text[i...start_idx]

              line_end = text.index("\n", start_idx) || text.length
              j = line_end + 1
              depth = 1

              while j < text.length && depth > 0
                next_line_end = text.index("\n", j) || text.length
                line = text[j...next_line_end]

                depth += line.scan(/\bdo\b/).length
                depth -= line.scan(/^\s*end\s*$/).length

                j = next_line_end + 1
              end

              i = j
            end

            result
          end

          podfile = remove_post_install_blocks(podfile).rstrip

          unified_hook = <<~HOOK

            post_install do |installer|
              installer.pods_project.targets.each do |target|
                flutter_additional_ios_build_settings(target)

                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '14.0'
                  config.build_settings['SWIFT_VERSION'] = '5.0'
                  config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                  config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                  config.build_settings['CODE_SIGN_IDENTITY'] = ''
                end
              end

              # Fix Xcode 15.4 Swift compilation error in camera_avfoundation
              Dir.glob("Pods/**/DefaultCamera.swift").each do |file|
                if File.exist?(file)
                  content = File.read(file)
                  patched = content
                    .gsub(/(?:AVFoundation\.)*AVCaptureSession\.wasInterruptedNotification/, "NSNotification.Name.AVCaptureSessionWasInterrupted")
                    .gsub(/(?:AVFoundation\.)*AVCaptureSession\.runtimeErrorNotification/, "NSNotification.Name.AVCaptureSessionRuntimeError")
                  File.write(file, patched) if patched != content
                end
              end
            end
          HOOK

          File.write(path, podfile + "\n" + unified_hook)
          RUBY

          # Patch Xcode project deployment target.
          PBX="ios/Runner.xcodeproj/project.pbxproj"
          if [ -f "$PBX" ]; then
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/g' "$PBX"
          fi

          # Patch Flutter xcconfig files.
          for f in ios/Flutter/Generated.xcconfig ios/Flutter/Release.xcconfig ios/Flutter/Debug.xcconfig; do
            mkdir -p "$(dirname "$f")"
            touch "$f"

            if grep -q "^IPHONEOS_DEPLOYMENT_TARGET=" "$f"; then
              sed -i '' "s/^IPHONEOS_DEPLOYMENT_TARGET=.*/IPHONEOS_DEPLOYMENT_TARGET=14.0/" "$f"
            else
              echo "IPHONEOS_DEPLOYMENT_TARGET=14.0" >> "$f"
            fi
          done

          echo "✅ Podfile patched with single post_install hook and iOS 14.0"

      - name: 📦 Install pub dependencies
        run: |
          flutter pub get

          echo "✅ Resolved Mapbox package:"
          grep -A 3 "mapbox_maps_flutter:" pubspec.lock || true

          echo "✅ Resolved camera_avfoundation package:"
          grep -A 3 "camera_avfoundation:" pubspec.lock || true

          python3 - <<'PY'
          import glob, os, re

          patterns = [os.path.expanduser("~/.pub-cache/**/DefaultCamera.swift")]
          for pat in patterns:
              for f in glob.glob(pat, recursive=True):
                  try:
                      os.chmod(f, 0o666)
                  except Exception:
                      pass
                  with open(f, "r", encoding="utf-8") as fp:
                      content = fp.read()
                  patched = re.sub(
                      r'(?:\bAVFoundation\.)*AVCaptureSession\.wasInterruptedNotification',
                      'NSNotification.Name.AVCaptureSessionWasInterrupted',
                      content
                  )
                  patched = re.sub(
                      r'(?:\bAVFoundation\.)*AVCaptureSession\.runtimeErrorNotification',
                      'NSNotification.Name.AVCaptureSessionRuntimeError',
                      patched
                  )
                  if patched != content:
                      with open(f, "w", encoding="utf-8") as fp:
                          fp.write(patched)
                      print(f"✅ Patched pub-cache: {f}")
          PY

      - name: 🧹 Clean iOS Pods
        run: |
          rm -rf ios/Pods
          rm -f ios/Podfile.lock
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/CocoaPods

      - name: 🔧 Generate Xcode config
        run: |
          flutter build ios --release --config-only --no-codesign \
            --build-number=${{ github.run_number }} \
            --build-name=1.2.${{ github.run_number }}

      - name: 🦕 Pod install
        run: |
          cd ios
          pod install --repo-update --verbose || pod install --verbose

      - name: 🩹 Patch camera_avfoundation Xcode 15.4 compatibility
        run: |
          python3 - <<'PY'
          import glob, os, re

          patterns = [
              os.path.expanduser("~/.pub-cache/**/DefaultCamera.swift"),
              "ios/**/DefaultCamera.swift",
          ]
          found = 0
          for pat in patterns:
              for f in glob.glob(pat, recursive=True):
                  found += 1
                  try:
                      os.chmod(f, 0o666)
                  except Exception:
                      pass
                  with open(f, "r", encoding="utf-8") as fp:
                      content = fp.read()
                  patched = re.sub(
                      r'(?:\bAVFoundation\.)*AVCaptureSession\.wasInterruptedNotification',
                      'NSNotification.Name.AVCaptureSessionWasInterrupted',
                      content
                  )
                  patched = re.sub(
                      r'(?:\bAVFoundation\.)*AVCaptureSession\.runtimeErrorNotification',
                      'NSNotification.Name.AVCaptureSessionRuntimeError',
                      patched
                  )
                  if patched != content:
                      with open(f, "w", encoding="utf-8") as fp:
                          fp.write(patched)
                      print(f"✅ Patched: {f}")
                  else:
                      print(f"ℹ️ Already correctly formatted: {f}")
          print(f"Total DefaultCamera.swift files examined: {found}")
          PY

      - name: 🔓 Patch Xcode signing
        run: |
          PBX="ios/Runner.xcodeproj/project.pbxproj"

          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;//g'                               "$PBX"
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;//g'                 "$PBX"
          sed -i '' 's/PROVISIONING_PROFILE = [^;]*;//g'                           "$PBX"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g'   "$PBX"
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' "$PBX"
          sed -i '' 's/CODE_SIGN_IDENTITY = [^;]*;//g'                             "$PBX"
          sed -i '' '/CODE_SIGNING_ALLOWED = YES;/d'                               "$PBX"

          {
            echo ""
            echo "// Unsigned sideload overrides"
            echo "CODE_SIGNING_ALLOWED=NO"
            echo "CODE_SIGNING_REQUIRED=NO"
            echo "CODE_SIGN_IDENTITY="
            echo "DEVELOPMENT_TEAM="
            echo "PROVISIONING_PROFILE_SPECIFIER="
            echo "IPHONEOS_DEPLOYMENT_TARGET=14.0"
          } >> ios/Flutter/Generated.xcconfig

          echo "✅ Signing patches applied."

      - name: 🏗️ Build iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=1.2.${{ github.run_number }} \
            build | tee xcodebuild.log || {
              echo "❌ xcodebuild failed. Diagnostics summary:"
              grep -i -C 2 -E "error:|fatal error:|\*\* BUILD FAILED \*\*|The following build commands failed:" xcodebuild.log || true
              echo "--- Last 200 lines of xcodebuild log ---"
              tail -n 200 xcodebuild.log
              exit 1
            }

      - name: 📦 Package IPA
        run: |
          APP_PATH=$(find build/DerivedData \
            -name "Runner.app" \
            -path "*/Release-iphoneos/*" \
            | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ Runner.app not found. Listing DerivedData:"
            find build/DerivedData -name "*.app" || true
            exit 1
          fi

          echo "✅ Found: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Runner.app
          zip -qq -r -9 TrackPro-AI.ipa Payload
          cp TrackPro-AI.ipa GPS-Tracker.ipa
          echo "✅ IPA size: $(du -sh TrackPro-AI.ipa | cut -f1)"

      - name: 📤 Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackPro-AI-IPA-v1.2.${{ github.run_number }}
          path: TrackPro-AI.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 🌐 Generate OTA manifest + install page
        run: |
          REPO="${{ github.repository }}"
          RUN="${{ github.run_number }}"
          VERSION="1.2.${RUN}"
          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"

          IPA_URL="https://github.com/${REPO}/releases/download/v${VERSION}/TrackPro-AI.ipa"
          PAGES_URL="https://${OWNER}.github.io/${REPO_NAME}"
          MANIFEST_URL="${PAGES_URL}/manifest.plist"

          mkdir -p ota

          cat > ota/manifest.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key><string>software-package</string>
                    <key>url</key><string>${IPA_URL}</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key><string>com.example.gpsTracker</string>
                  <key>bundle-version</key><string>${VERSION}</string>
                  <key>kind</key><string>software</string>
                  <key>title</key><string>TrackPro AI</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

          cat > ota/index.html << HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1"/>
            <title>TrackPro AI — Install</title>
            <style>
              body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#000;color:#fff;
                   display:flex;flex-direction:column;align-items:center;
                   justify-content:center;min-height:100vh;margin:0;padding:24px;box-sizing:border-box;}
              h1{font-size:1.8rem;margin-bottom:4px;font-weight:700;}
              p{color:#8e8e93;margin-bottom:32px;font-size:.95rem;}
              a.btn{display:inline-block;background:#007aff;color:#fff;
                    padding:16px 44px;border-radius:16px;font-size:1.1rem;
                    font-weight:600;text-decoration:none;letter-spacing:.3px;
                    box-shadow:0 8px 24px rgba(0,122,255,0.35);}
              .note{margin-top:28px;color:#636366;font-size:.8rem;text-align:center;line-height:1.5;}
            </style>
          </head>
          <body>
            <h1>📍 TrackPro AI</h1>
            <p>v${VERSION} · iOS Release Build</p>
            <a class="btn"
               href="itms-services://?action=download-manifest&url=${MANIFEST_URL}">
              ⬇️ Install on iPhone
            </a>
            <p class="note">
              Open this page in <strong>Safari</strong> on your iPhone.<br/>
              Chrome and Firefox cannot trigger OTA installs.<br/><br/>
              ⚠️ Unsigned build — device must be registered in Apple Developer portal<br/>
              or use AltStore / Sideloadly / TrollStore.
            </p>
          </body>
          </html>
          HTML

          echo "MANIFEST_URL=${MANIFEST_URL}" >> $GITHUB_ENV
          echo "PAGES_URL=${PAGES_URL}" >> $GITHUB_ENV

      - name: ✅ Verify IPA before release upload
        run: |
          set -e
          ls -lah
          test -f TrackPro-AI.ipa
          test -f GPS-Tracker.ipa
          echo "✅ IPA exists:"
          du -sh TrackPro-AI.ipa GPS-Tracker.ipa

      - name: 🚀 Upload IPA to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: TrackPro AI v1.2.${{ github.run_number }}
          files: |
            TrackPro-AI.ipa
            GPS-Tracker.ipa
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            ## 📍 TrackPro AI — v1.2.${{ github.run_number }}

            | Field | Value |
            |---|---|
            | Platform | iOS 14.0+ (Universal iPhone) |
            | UI/UX | Apple Human Interface Guidelines (HIG) Cupertino |
            | Live Activities | Apple ActivityKit & Dynamic Island Ready |
            | Map Engine | Hardware GPU Mapbox GeoJSON Layers |
            | Flutter | 3.27.4 |
            | Build | ${{ github.run_number }} |

            ### 📲 Direct OTA Install
            Open this link **in Safari on your iPhone**:

            👉 ${{ env.PAGES_URL }}

            ### 📦 IPA Asset
            Download the IPA from this release:
            * `TrackPro-AI.ipa`
            * `GPS-Tracker.ipa`

            > ⚠️ Unsigned build — install via TrollStore, AltStore, Sideloadly, or Apple Developer UDID provisioning.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Deploy OTA page to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ota
          force_orphan: true

name: gps_tracker
description: GPS Speed Tracker App for iOS and Web
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # GPS & Location
  build_runner: ^2.4.9        # ← add this
  hive_generator: ^2.0.1      # ← add this if missing too
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Maps
  flutter_map: ^8.0.0
  latlong2: ^0.9.1

  # Charts
  fl_chart: ^0.71.0

  # Network
  http: ^1.3.0

  # UI & Utils
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  shared_preferences: ^2.3.5

  # Screen wake lock
  wakelock_plus: ^1.2.11
  google_generative_ai: ^0.4.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
